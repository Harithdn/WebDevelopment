<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div><!--Used to group elements together as a single unit as a block element-->
    <a href="https://mail.google.com/mail/u/0/">Gmail</a>
    <p><a href="https://www.youtube.com/">youtube</a></p>
    </div>
    <span><!--span is used to group elements in a single inline block rather than seperate blocks-->
    <a href="https://mail.google.com/mail/u/0/">Gmail</a>
    <a href="https://www.youtube.com/">youtube</a>
    </span>
    <h1>a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></h1><!--sup means superscript-->
    <h1>C<SUB>6</SUB>H<SUB>12</SUB>O<SUB>6</SUB></h1><!-- sub means subscript-->

    <header>My website</header>
    <main>Main content</main>
    <footer>Contact details
        <nav><a href="https://mail.google.com/mail/u/0/">Mail</a></nav>
    </footer>
    <h1>The sky is cloudy &#9729 &amp; it will rain &#9748; today</h1>
    <!--Emmet: ul>li*5 (Multiplication) -->
    <ul>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>
    <!-- Emmet: p>div+img (Siblings)-->
    <p>
        <div></div>
        <img src="" alt="">
    </p>
    <video source src="vid.mp4" width="250"></video>

</body>
</html>
