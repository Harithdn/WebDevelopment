<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <table border="black">

        <caption>Food Menu</caption>
        <thead><!--Table semantics: Table Header-->
            <tr><th>Item</th><th>Price</th></tr>
        </thead>
        <!--Table semantics: Table Body-->
        <tbody>
            <tr><td>Frooti</td><td>10</td></tr>
            <tr><td>Samosa</td><td>12</td></tr>
            <tr><td>Chips</td><td>20</td></tr>
        </tbody>
        <tfoot>
            <tr><td>Sum</td><td>60</td></tr>
        </tfoot>
        

    </table>

    <table border="black">
        <thead>
            <tr>
                <th rowspan="2">Item</th>
                <th colspan="2">Price</th>
            </tr>
            <tr>
                <th>INR</th>
                <th>USD</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Frooti</td>
                <td>10</td>
                <td>0.14</td>
            </tr>
            <tr>
                <td>Samosa</td>
                <td>12</td>
                <td>0.17</td>
            </tr>
            <tr>
                <td>Chips</td>
                <td>20</td>
                <td>0.28</td>
            </tr>
        </tbody>
    </table>

    <table border="black" bgcolor="red">
        <caption>A table with merged cells</caption>
        <tbody>
            <tr>
                <td rowspan="2"></td>
                <td colspan="2">Average</td>
                <td rowspan="2">Red Eyes</td>
            </tr>
            <tr>
                <td>Height</td>
                <td>Weight</td>
            </tr>
            <tr>
                <td>Males</td>
                <td>1.9</td>
                <td>0.0003</td>
                <td>40%</td>
            </tr>
            <tr>
                <td>Females</td>
                <td>1.7</td>
                <td>0.0002</td>
                <td>43%</td>
            </tr>
        </tbody>
    </table>
    
</body>
</html>
