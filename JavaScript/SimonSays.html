<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimonSays</title>
    <link rel="stylesheet" href="SimonSays.css">
</head>
<body>
    <h1>SimonSays Game</h1>
    <br>
    <h2>Press any key to start the game</h2>
    <br>
    <div class="btncontainer">
        <div class="div1">
        <div class="btn red" type="button" id="red">1</div>
        <div class="btn orange" type="button" id="orange">2</div>
        </div>
        <div class="div2">
        <div class="btn green" type="button" id="green">3</div>
        <div class="btn blue" type="button" id="blue">4</div>
    </div>
        
    </div>
    <script src="SimonSays.js"></script>
</body>
</html>
